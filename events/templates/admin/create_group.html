{% extends "admin/adminbase.html" %}
{% load static %}

{% block title %}Create Group{% endblock %}

{% block content %}
    <section class="bg-slate-900 min-h-screen py-10 px-4 text-slate-200">
        <div class="max-w-3xl mx-auto p-6 bg-slate-800 rounded-3xl shadow-xl border border-slate-700">
            <h1 class="text-2xl font-bold mb-6 text-cyan-300">Create New Group</h1>
            <form method="post" class="space-y-6">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" 
                        class="px-6 py-2 bg-gradient-to-r from-blue-500 to-cyan-400 text-black font-semibold rounded-lg shadow-lg hover:scale-105 transition">
                    Create Group
                </button>
            </form>
        </div>
    </section>
{% endblock %}
